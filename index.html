<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>거꾸로 생각한다면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 교실 TV에 띄우는 놀이판, 선생님이 쓰면 바로 거꾸로 바뀌는 마법 칠판
   IDEA: 거울 앞 칠판 — 위는 선생님이 쓴 말, 화면 가운데는 거꾸로 바뀐 말
   PICTURE: 화면 대부분을 차지하는 큰 글자 카드, 아래에 선생님 입력칸
   COLOUR and TYPE: 코랄·네이비·골드(쌤솟다 팔레트), Jua + Gowun Dodum
   LAYOUT: 상단 제목+세 탭, 가운데 큰 카드, 하단 접을 수 있는 입력칸 */
:root{color-scheme:light dark;
--bg:light-dark(#fff4ee,#141b3d);--card:light-dark(#ffffff,#1f2a5a);
--ink:light-dark(#1f2a5a,#fdf1ea);--soft:light-dark(#6a7096,#b8bddb);
--coral:#ff6b5b;--navy:#1f2a5a;--gold:#f5b82e;--line:light-dark(#f1d9cd,#2e3a74);
--field:light-dark(#fff9f6,#141b3d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;font-family:Jua,system-ui,sans-serif;cursor:pointer;border:0;border-radius:16px;min-height:50px;padding:8px 20px;font-size:21px}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
header{background:var(--navy);color:#fff;padding:12px max(3vw,14px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-family:Jua,sans-serif;font-weight:400;margin:0;font-size:clamp(26px,3.4vw,38px);flex:1 1 auto;cursor:pointer;user-select:none;white-space:nowrap}
header h1 span{display:inline-block;transition:transform .6s cubic-bezier(.5,1.6,.4,1)}
header h1 span.f{transform:rotate(180deg);color:var(--gold)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.12);color:#fff;font-size:19px;min-height:48px}
.tab b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);margin-right:6px;font-weight:400;font-size:16px}
.tab.on{background:var(--coral)}.tab.on b{background:#fff;color:var(--coral)}
.fs{background:transparent;color:#d9defa;font-size:16px;min-height:44px;padding:6px 12px;border:2px solid rgba(255,255,255,.25)}
#mus.on,#secret.on2,#stu.on2{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.mw{position:relative;flex:1 1 280px;display:flex}
.mw input{flex:1}
input.secret{color:transparent!important;caret-color:transparent}
input.secret::placeholder{color:transparent}
.mask{display:none;position:absolute;inset:0;padding:0 19px;align-items:center;gap:0;pointer-events:none;overflow:hidden;white-space:pre;font:24px "Gowun Dodum",sans-serif;color:var(--ink)}
.mw.on .mask{display:flex}
.mask .d{display:inline-block;width:22px;text-align:center;font-size:16px;line-height:1}
.mask .sp{display:inline-block;width:18px}
.mask .pu{display:inline-block;padding:0 2px}
.mask .cur{display:none;width:3px;height:28px;background:var(--coral);margin-left:3px;animation:blink 1s steps(1) infinite}
.mw.focus .mask .cur{display:inline-block}
.mask .ph{color:var(--soft);opacity:.7}
.mask small{margin-left:auto;padding-left:12px;font-size:15px;color:var(--soft);font-family:Jua,sans-serif}
@keyframes blink{50%{opacity:0}}
body:not(.sec) .showbtn{display:none}
.stubadge{display:none;background:var(--gold);color:var(--navy);font-family:Jua,sans-serif;border-radius:99px;padding:4px 14px;font-size:16px}
body.student .panel,body.student .tabs,body.student #mus,body.student #secret,body.student #stu{display:none}
body.student .stubadge{display:inline-block}
body.student main{max-width:none}
body.student .card{min-height:calc(100vh - 120px)}
.dirty{box-shadow:0 0 0 4px var(--gold) inset}
main{flex:1;display:flex;flex-direction:column;padding:clamp(12px,2.4vw,28px) max(3vw,14px);gap:16px;max-width:1400px;width:100%;margin:0 auto}
.card{flex:1;background:var(--card);border:4px solid var(--line);border-radius:34px;min-height:min(58vh,560px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.2vw,24px);padding:clamp(20px,4vw,48px) 20px;text-align:center;position:relative;overflow:hidden}
.ask{font-family:Jua,sans-serif;font-size:clamp(24px,3.4vw,40px);color:var(--coral);margin:0}
.banner{font-family:Jua,sans-serif;font-size:clamp(34px,5.6vw,72px);line-height:1.1;color:#fff;background:var(--coral);border-radius:26px;padding:10px clamp(20px,3vw,40px);margin:0;box-shadow:0 8px 0 #e04c3c}
.txt{font-family:Jua,sans-serif;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;max-width:100%;display:inline-block}
.q{color:var(--ink)}
.a{color:var(--coral)}
.tag{display:inline-block;background:var(--gold);color:var(--navy);border-radius:99px;padding:4px 18px;font-family:Jua,sans-serif;font-size:clamp(18px,2vw,24px)}
.ansbox{display:none;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.card.open .ansbox{display:flex;animation:up .5s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
#flipTxt{transition:transform 1.3s cubic-bezier(.6,.1,.3,1.2),color .4s .9s}
.hint{color:var(--soft);font-size:clamp(17px,2vw,22px);margin:0}
.empty{color:var(--soft);font-family:Jua,sans-serif;font-size:clamp(26px,3.4vw,40px);opacity:.6}
.count{position:absolute;inset:0;display:none;place-items:center;font-family:Jua,sans-serif;font-size:clamp(120px,20vw,230px);color:var(--coral);background:var(--card);z-index:3}
.panel{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px clamp(14px,2vw,22px)}
.panel.hide .pbody{display:none}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead strong{font-family:Jua,sans-serif;font-weight:400;font-size:20px;flex:1}
.fold{background:transparent;color:var(--soft);border:2px solid var(--line);font-size:16px;min-height:42px;padding:4px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row label{font-family:Jua,sans-serif;font-size:18px;color:var(--soft);flex:0 0 auto}
input[type=text]{flex:1 1 280px;font:24px "Gowun Dodum",sans-serif;color:var(--ink);background:var(--field);border:3px solid var(--line);border-radius:16px;padding:10px 16px;min-height:56px}
.b1{background:var(--coral);color:#fff}
.b2{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.b3{background:var(--gold);color:var(--navy)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--field);color:var(--ink);border:3px solid var(--line);font-size:18px;min-height:46px;padding:6px 14px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips span{color:var(--soft);font-size:15px;align-self:center}
.chip{background:var(--field);color:var(--ink);border:2px dashed var(--line);font-family:"Gowun Dodum",sans-serif;font-size:16px;min-height:40px;padding:4px 14px;border-radius:99px}
.mode{display:none;flex-direction:column;gap:16px;flex:1}.mode.on{display:flex}
.keys{color:var(--soft);font-size:14px;margin-top:10px}
@media(max-width:700px){header h1{flex-basis:100%}.tab{flex:1 1 30%;font-size:16px;padding:6px 8px}.tab b{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="title" title="눌러 보세요!"></h1>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="0" role="tab"><b>1</b>거꾸로 말하기</button>
    <button class="tab" data-tab="1" role="tab"><b>2</b>거꾸로 보이는 글자</button>
    <button class="tab" data-tab="2" role="tab"><b>3</b>반대로 행동하기</button>
  </div>
  <button class="fs on2" id="secret" aria-pressed="true">입력 가리기 켜짐</button>
  <button class="fs" id="stu">학생 화면 따로 열기</button>
  <span class="stubadge">학생 화면</span>
  <button class="fs" id="mus" aria-pressed="false">♪ 음악 켜기</button>
  <button class="fs" id="fs">전체 화면</button>
</header>

<main>
  <!-- 1. 거꾸로 말하기 -->
  <section class="mode on" id="m0">
    <div class="card" id="c0">
      <div class="count"></div>
      <p class="ask">무슨 말일까요?</p>
      <div class="txt q" id="q0"></div>
      <div class="ansbox"><span class="tag">바르게 말하면</span><div class="txt a" id="a0"></div></div>
    </div>
    <div class="panel" id="p0">
      <div class="phead"><strong>선생님 입력칸</strong><button class="fold">입력칸 접기</button></div>
      <div class="pbody">
        <div class="row"><input type="text" id="i0" placeholder="예: 친구야, 안녕?" autocomplete="off" aria-label="아이들에게 거꾸로 보여 줄 문장">
          <button class="b2 showbtn" data-show="0">화면에 보이기</button><button class="b3" data-count="0">5초 세기</button><button class="b1" id="r0">정답 보기</button></div>
        <div class="chips" data-for="0"><span>예시</span></div>
        <div class="keys" data-k="0"></div>
      </div>
    </div>
  </section>

  <!-- 2. 거꾸로 보이는 글자 -->
  <section class="mode" id="m1">
    <div class="card" id="c1">
      <div class="count"></div>
      <span class="tag" id="mtag">거울에 비친 글자</span>
      <div class="txt q" id="flipTxt"></div>
      <p class="hint" id="h1">어떤 글자일까요? 바르게 읽어 보세요!</p>
    </div>
    <div class="panel" id="p1">
      <div class="phead"><strong>선생님 입력칸</strong><button class="fold">입력칸 접기</button></div>
      <div class="pbody">
        <div class="row"><input type="text" id="i1" placeholder="예: 친구야, 안녕?" autocomplete="off" aria-label="뒤집어 보여 줄 글자">
          <button class="b2 showbtn" data-show="1">화면에 보이기</button><button class="b3" data-count="1">5초 세기</button><button class="b1" id="r1">바르게 돌리기</button></div>
        <div class="row"><label>모양</label>
          <div class="seg" id="seg">
            <button data-m="m" class="on">거울에 비친 글자</button><button data-m="r">물구나무 선 글자</button><button data-m="v">물에 비친 글자</button><button data-m="x">무작위</button>
          </div></div>
        <div class="chips" data-for="1"><span>예시</span></div>
      </div>
    </div>
  </section>

  <!-- 3. 반대로 행동하기 -->
  <section class="mode" id="m2">
    <div class="card" id="c2">
      <div class="count"></div>
      <p class="banner">반대로 행동하세요!</p>
      <div class="txt q" id="q2"></div>
      <div class="ansbox"><span class="tag">거꾸로 이렇게!</span><div class="txt a" id="a2"></div></div>
    </div>
    <div class="panel" id="p2">
      <div class="phead"><strong>선생님 입력칸</strong><button class="fold">입력칸 접기</button></div>
      <div class="pbody">
        <div class="row"><label for="i2">명령</label><input type="text" id="i2" placeholder="예: 앉으세요." autocomplete="off">
          <button class="b2 showbtn" data-show="2">화면에 보이기</button><button class="b3" data-count="2">5초 세기</button></div>
        <div class="row"><label for="i2b">정답 행동 (안 써도 돼요)</label><input type="text" id="i2b" placeholder="예: 일어나요" autocomplete="off">
          <button class="b1" id="r2">정답 보기</button></div>
        <div class="chips" data-for="2"><span>예시</span></div>
        <div class="keys" data-k="2"></div>
      </div>
    </div>
  </section>
</main>

<script>
{
const $=id=>document.getElementById(id);

/* 거꾸로 말하기: 낱말 순서와 글자 순서를 뒤집고, 낱말 사이 쉼표·띄어쓰기는 제자리, 문장 끝 부호는 뺌 */
function revText(s){
  s=s.trim().replace(/[?？!！.。~…]+$/,'');
  const parts=s.split(/([가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9]+)/);
  const words=[];for(let i=1;i<parts.length;i+=2)words.push(parts[i]);
  words.reverse();let k=0;
  for(let i=1;i<parts.length;i+=2)parts[i]=[...words[k++]].reverse().join('');
  return parts.join('').trim();
}
function size(el,s){
  const n=[...s].length;
  el.style.fontSize=n<=4?'clamp(72px,14vw,190px)':n<=8?'clamp(60px,10.5vw,150px)':n<=14?'clamp(46px,7.5vw,110px)':n<=24?'clamp(36px,5.4vw,80px)':'clamp(28px,4vw,58px)';
}
const EMPTY='<span class="empty">아래 입력칸에 글자를 써 보세요</span>';

/* sound */
let ac=null;
function beep(f,d,type){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const ding=()=>{beep(784,.18);setTimeout(()=>beep(1046,.3),140)};

/* title */
const TT='거꾸로 생각한다면';
$('title').innerHTML=[...TT].map(c=>c===' '?' ':`<span>${c}</span>`).join('');
$('title').onclick=()=>[...$('title').querySelectorAll('span')].forEach((s,i)=>setTimeout(()=>{s.classList.toggle('f');beep(400+i*60,.12,'triangle')},i*80));

/* modes: 입력 가리기, 학생 화면(두 번째 창) */
const STUDENT=location.hash==='#student';
let chan=null;try{chan=new BroadcastChannel('ggThink-v1')}catch(e){}
const send=m=>{if(chan&&!STUDENT)try{chan.postMessage(m)}catch(e){}};
let secret=true;
if(STUDENT)document.body.classList.add('student');
const EMPTY_T='<span class="empty">입력하고 ‘화면에 보이기’를 눌러요</span>',EMPTY_L='<span class="empty">아래 입력칸에 글자를 써 보세요</span>',EMPTY_S='<span class="empty">선생님이 문제를 준비하고 있어요</span>';
const empty=()=>STUDENT?EMPTY_S:secret?EMPTY_T:EMPTY_L;

/* tabs */
let tab=0;
function selTab(i){tab=i;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',+x.dataset.tab===i));
  document.querySelectorAll('.mode').forEach((m,k)=>m.classList.toggle('on',k===i))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selTab(+b.dataset.tab);send({t:'tab',i:tab});
  const inp=$('i'+tab);if(inp&&!$('p'+tab).classList.contains('hide'))inp.focus()});
$('fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
document.querySelectorAll('.fold').forEach(b=>b.onclick=()=>{const p=b.closest('.panel');p.classList.toggle('hide');b.textContent=p.classList.contains('hide')?'입력칸 펼치기':'입력칸 접기'});

/* what the children's screen shows (kept so a newly opened student window can catch up) */
const st={tab:0,d:[{s:''},{s:'',cur:'m'},{s:'',a:''}],open:[false,false,false]};

/* 1. 거꾸로 말하기 */
function draw0(s){st.d[0]={s};st.open[0]=false;$('c0').classList.remove('open');$('r0').textContent='정답 보기';
  if(!s){$('q0').innerHTML=empty();$('q0').style.fontSize='';$('a0').textContent='';return}
  const r=revText(s);$('q0').textContent=r;size($('q0'),r);$('a0').textContent=s;size($('a0'),s)}
function reveal0(force){if(!st.d[0].s)return;const o=force!=null?force:!st.open[0];st.open[0]=o;$('c0').classList.toggle('open',o);$('r0').textContent=o?'정답 숨기기':'정답 보기';if(o&&!STUDENT)ding()}

/* 2. 거꾸로 보이는 글자 */
const FL={m:['scaleX(-1)','거울에 비친 글자'],r:['rotate(180deg)','물구나무 선 글자'],v:['scaleY(-1)','물에 비친 글자']};
let mode='m';
const pick=()=>mode==='x'?'mrv'[Math.floor(Math.random()*3)]:mode;
function draw1(s,cur){const t=$('flipTxt');st.d[1]={s,cur};st.open[1]=false;$('r1').textContent='바르게 돌리기';
  $('mtag').textContent=FL[cur][1];t.style.color='';
  if(!s){t.innerHTML=empty();t.style.transform='none';t.style.fontSize='';$('h1').style.visibility='hidden';return}
  $('h1').style.visibility='';t.textContent=s;size(t,s);t.style.transition='none';t.style.transform=FL[cur][0];void t.offsetWidth;t.style.transition=''}
function reveal1(force){const t=$('flipTxt'),d=st.d[1];if(!d.s)return;const u=force!=null?force:!st.open[1];st.open[1]=u;
  t.style.transform=u?'none':FL[d.cur][0];t.style.color=u?'var(--coral)':'';$('r1').textContent=u?'다시 뒤집기':'바르게 돌리기';if(u&&!STUDENT)ding()}

/* 3. 반대로 행동하기 */
function draw2(s,a){st.d[2]={s,a};st.open[2]=false;$('c2').classList.remove('open');$('r2').textContent='정답 보기';
  if(!s){$('q2').innerHTML=empty();$('q2').style.fontSize=''}else{$('q2').textContent=s;size($('q2'),s)}
  $('a2').textContent=a;if(a)size($('a2'),a);$('r2').style.display=a?'':'none'}
function reveal2(force){if(!st.d[2].a)return;const o=force!=null?force:!st.open[2];st.open[2]=o;$('c2').classList.toggle('open',o);$('r2').textContent=o?'정답 숨기기':'정답 보기';if(o&&!STUDENT)ding()}

const DRAW=[d=>draw0(d.s),d=>draw1(d.s,d.cur),d=>draw2(d.s,d.a)],REV=[reveal0,reveal1,reveal2];
const dirty=[false,false,false];
function markDirty(i,v){dirty[i]=v;const ins=i===2?[$('i2'),$('i2b')]:[$('i'+i)];ins.forEach(x=>x.classList.toggle('dirty',v&&secret))}
/* teacher actions: run here and mirror to the student window */
function show(i){let d;
  if(i===0)d={s:$('i0').value.trim()};
  if(i===1)d={s:$('i1').value.trim(),cur:pick()};
  if(i===2)d={s:$('i2').value.trim(),a:$('i2b').value.trim()};
  DRAW[i](d);markDirty(i,false);send({t:'draw',i,d})}
function rev(i){if(dirty[i])show(i);REV[i]();send({t:'open',i,v:st.open[i]})}
function onInput(i){if(secret)markDirty(i,true);else show(i)}
$('i0').oninput=()=>onInput(0);$('i1').oninput=()=>onInput(1);$('i2').oninput=()=>onInput(2);$('i2b').oninput=()=>onInput(2);
$('r0').onclick=()=>rev(0);$('r1').onclick=()=>rev(1);$('r2').onclick=()=>rev(2);
document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>show(+b.dataset.show));
const enter=(el,fn)=>el.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();fn()}};
enter($('i0'),()=>dirty[0]?show(0):rev(0));
enter($('i1'),()=>dirty[1]?show(1):rev(1));
enter($('i2'),()=>dirty[2]?show(2):startCount(2));
enter($('i2b'),()=>rev(2));

/* countdown */

  timer=setInterval(()=>{n--;if(n>0){el.textContent=n;if(!STUDENT)beep(520,.15)}else{clearInterval(timer);el.style.display='none';if(!STUDENT)beep(880,.35);
    Music.duck(false);if(!STUDENT&&!st.open[i])rev(i)}},1000)}
function startCount(i){if(dirty[i])show(i);count(i);send({t:'count',i})}

/* 입력 가리기: 글자마다 ● 하나, 띄어쓰기는 빈칸, 문장부호는 그대로, 끝에 글자 수 */
const LET=/[가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9]/;
const escH=c=>c.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
const MASKS={};
['i0','i1','i2','i2b'].forEach(id=>{const inp=$(id),w=document.createElement('span');w.className='mw';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const m=document.createElement('span');m.className='mask';m.setAttribute('aria-hidden','true');w.appendChild(m);MASKS[id]={w,m};
  inp.addEventListener('input',()=>mask(id));inp.addEventListener('focus',()=>{w.classList.add('focus');mask(id)});inp.addEventListener('blur',()=>w.classList.remove('focus'))});
function mask(id){const v=$(id).value,cs=[...v];let n=0;
  const body=cs.map(c=>{if(c===' ')return'<span class="sp"></span>';if(LET.test(c)){n++;return'<span class="d">●</span>'}return`<span class="pu">${escH(c)}</span>`}).join('');
  MASKS[id].m.innerHTML=(cs.length?body:'<span class="ph">여기에 쓰면 ●로 가려져요</span>')+'<span class="cur"></span>'+(n?`<small>${n}글자</small>`:'')}
const maskAll=()=>Object.keys(MASKS).forEach(mask);

/* 입력 가리기 */
const KEYS=['Enter 한 번: 화면에 보이기 · 한 번 더: 정답 보기','',''];
function setSecret(v){secret=v;document.body.classList.toggle('sec',v);
  ['i0','i1','i2','i2b'].forEach(id=>{$(id).classList.toggle('secret',v);MASKS[id].w.classList.toggle('on',v)});maskAll();
  $('secret').classList.toggle('on2',v);$('secret').setAttribute('aria-pressed',v);$('secret').textContent=v?'입력 가리기 켜짐':'입력 가리기 꺼짐';
  document.querySelector('[data-k="0"]').textContent=v?'글자 하나에 ● 하나, 띄어쓰기는 빈칸, 쉼표·물음표는 그대로 보여요. Enter 한 번: 화면에 보이기, 한 번 더: 정답 보기':'쓰는 대로 화면에 바로 보여요. Enter를 누르면 정답이 나와요.';
  document.querySelector('[data-k="2"]').textContent=v?'글자가 ●로 가려져요. 명령칸 Enter: 화면에 보이기, 한 번 더: 5초 세기 · 정답 행동칸 Enter: 정답 보기':'쓰는 대로 화면에 바로 보여요. 정답 행동은 아이들에게도 보이니 미리 써 두고 입력칸을 접어 두세요.';
  if(!v)[0,1,2].forEach(i=>{if(dirty[i])show(i)});
  [0,1,2].forEach(i=>markDirty(i,dirty[i]));
  if(!st.d[0].s)draw0('');if(!st.d[1].s)draw1('',st.d[1].cur);if(!st.d[2].s)draw2('','')}

  if(m.t==='tab')selTab(m.i);

/* background music: 직접 만든 마림바 곡, 멜로디가 중간에 위아래로 뒤집혀요 */
const Music=(()=>{
  let ctx=null,master=null,on=false,iv=null,next=0,step=0,noise=null;
  const BEAT=60/126,E8=BEAT/2,SC=[0,2,4,5,7,9,11];
  const semi=d=>12*Math.floor(d/7)+SC[((d%7)+7)%7];
  const A=[[7,null,4,4,5,4,2,null],[5,null,4,2,0,2,4,null],[3,null,5,5,7,5,3,null],[4,5,6,7,8,null,null,null]];
  const INV=A.map(b=>b.map(d=>d==null?null:8-d));
  const B=[[9,8,7,null,7,9,7,4],[5,4,5,7,9,null,7,null],[8,7,5,3,5,null,7,null],[6,5,4,2,4,null,null,null]];
  const MEL=[...A,...INV,...B,...A];
  const CH=[[0,2,4],[5,7,9],[3,5,7],[4,6,8]],ROOT=[0,-2,-4,-3];
  function tone(f,t,dur,vol,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
  function hit(t,vol,freq,dur){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02)}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);
    g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3)}
  function play(st,t){const bar=Math.floor(st/8)%16,k=st%8,d=MEL[bar][k],ch=bar%4;
    if(d!=null){const f=523.25*2**(semi(d)/12);tone(f,t,.6,.13);tone(f*4,t,.09,.03)}
    hit(t,k%2?.03:.018,7000,.05);
    if(k%2===0){const beat=k/2;if(beat===0||beat===2)kick(t);if(beat===1||beat===3)hit(t,.07,1800,.16);
      if(beat!==1)tone(65.41*2**(semi(ROOT[ch]+(beat===2?4:0))/12),t,.42,.2,'triangle')}
    if(k===3||k===7)CH[ch].forEach(x=>tone(261.63*2**(semi(x)/12),t,.28,.035,'triangle'))}
  function tick(){while(next<ctx.currentTime+.15){play(step,next);next+=E8;step=(step+1)%128}}
  function toggle(){
    try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
        noise=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
      if(ctx.state==='suspended')ctx.resume();
      on=!on;const now=ctx.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);
      if(on){step=0;next=now+.08;tick();iv=setInterval(tick,25);master.gain.linearRampToValueAtTime(.55,now+.6)}
      else{master.gain.linearRampToValueAtTime(0,now+.4);setTimeout(()=>{if(!on)clearInterval(iv)},450)}
    }catch(e){on=false}
    return on}
  function duck(x){if(!ctx||!on)return;master.gain.setTargetAtTime(x?.2:.55,ctx.currentTime,.15)}
  return{toggle,duck};
})();
$('mus').onclick=()=>{const o=Music.toggle();$('mus').classList.toggle('on',o);$('mus').setAttribute('aria-pressed',o);$('mus').textContent=o?'♪ 음악 끄기':'♪ 음악 켜기'};
