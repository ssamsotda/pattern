<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>규칙대로 선물 포장하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 1학년 교실의 크리스마스 놀이 — 따뜻하고 신나게
   IDEA: 눈 내리는 밤, 선물 포장대 위에 펼친 포장지
   PICTURE: 스티커를 붙이는 포장지(게임판) 자체, 성공 시 리본 풀리는 선물 상자
   COLOUR and TYPE: 밤 남색 바탕, 크림 포장지, 코랄 리본, 금색 별 / Jua
   LAYOUT: 제목-포장지-스티커판-버튼 한 줄 세로 흐름, 태블릿 우선 */
:root{color-scheme:dark;--night:#1d2a4d;--night2:#2b3d6b;--paper:#fff8ec;--ink:#2a2340;--coral:#ff6b6b;--coral2:#e04b4b;--gold:#f4b942;--green:#3fa36b;--snow:#fff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body,button,.cell,.stk{touch-action:manipulation}
body{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,var(--night2),var(--night) 70%);color:var(--snow);font:18px/1.45 Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip;user-select:none}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:16px max(3vw,12px) 40px;position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:400;line-height:1.1;text-wrap:balance}
h1 b{color:var(--gold);font-weight:400}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.1);padding:5px;border-radius:999px}
.tabs button{padding:8px 16px;border-radius:999px;background:transparent;color:#dfe6ff;min-height:44px;font-size:17px}
.tabs button.on{background:var(--coral);color:#fff}
.snd{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.lv{font-size:22px;color:var(--gold)}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.dots i.done{background:var(--gold)}.dots i.now{background:var(--coral);box-shadow:0 0 0 3px rgba(255,107,107,.35)}
.msg{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;font-size:clamp(17px,2.6vw,21px);min-height:52px;display:block;line-height:1.45;word-break:keep-all}
.msg.bad{background:rgba(255,107,107,.25)}
.paper{margin:14px auto 0;background:var(--paper);border-radius:18px;padding:clamp(8px,1.8vw,16px);box-shadow:0 10px 0 #d9ccb4,0 18px 30px rgba(0,0,0,.35);position:relative;
  background-image:repeating-linear-gradient(45deg,rgba(255,107,107,.06) 0 12px,transparent 12px 24px)}
.paper::before{content:"포장지";position:absolute;top:-14px;left:18px;background:var(--green);color:#fff;font-size:15px;padding:2px 12px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(4px,1vw,8px);margin:0 auto}
.cell{aspect-ratio:1;border-radius:14px;border:3px dashed #d8c9ad;background:#fffdf7;display:grid;place-items:center;font-size:calc(min(64px,(100vw - 90px)/var(--cols))*.62);line-height:1;padding:0;transition:transform .12s}
.cell.f{border-style:solid;border-color:transparent}
.cell.lock{position:relative}
.cell.lock::after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff}
.cell.q{border:4px dashed var(--coral);color:var(--coral);font-size:calc(min(64px,(100vw - 90px)/var(--cols))*.55);background:#fff1ec;animation:qp 1s ease-in-out infinite}
@keyframes qp{0%,100%{background:#fff1ec;border-color:var(--coral);color:var(--coral)}50%{background:#ffc9bd;border-color:#ffd166;color:#e04b4b}}
.stk.wrong{animation:shake .45s 2}
.cell.pop{animation:pop .25s}
.cell.wrong{border:3px solid var(--coral2)!important;animation:shake .45s 2}
.cell.hole{animation:blink .6s 3}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-5px) rotate(-6deg)}75%{transform:translateX(5px) rotate(6deg)}}
@keyframes blink{50%{background:#ffe08a}}
.pal-t{margin:22px 0 8px;font-size:18px;color:#c9d3f5}
.pal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.stk{width:clamp(58px,10vw,74px);aspect-ratio:1;border-radius:20px;font-size:clamp(34px,6vw,44px);display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .12s}
.stk.on{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 4px var(--gold),0 9px 0 rgba(0,0,0,.25)}
.stk.era{background:#eef1fb;font-size:30px;color:var(--ink)}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.acts button{min-height:56px;padding:0 24px;border-radius:999px;font-size:20px;background:rgba(255,255,255,.14);color:#fff}
.acts .go{background:var(--coral);box-shadow:0 5px 0 var(--coral2);font-size:23px;padding:0 34px}
.acts .go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral2)}
.snowfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snowfx i{position:absolute;top:-20px;color:#fff;opacity:.7;animation:fall linear infinite;font-style:normal}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
/* 성공 화면 */
.ov{position:fixed;inset:0;z-index:10;background:rgba(15,22,45,.88);display:none;align-items:center;justify-content:flex-start;flex-direction:column;padding:20px;overflow-x:hidden;overflow-y:auto}
.ov>.scene{margin-top:auto;flex:none}.ov>#ovActs{margin-bottom:auto;padding-bottom:10px}
.ov.show{display:flex}
.scene{position:relative;width:min(400px,86vw);height:min(440px,92vw);margin-top:40px}
.box{position:absolute;left:7%;right:7%;bottom:0;display:flex;flex-direction:column;z-index:2;animation:boxin .5s ease-out}
@keyframes boxin{from{transform:scale(.3);opacity:0}}
.lid{position:relative;z-index:3;height:clamp(42px,11vw,60px);margin:0 -5%;background:linear-gradient(#ff7377,#e3343b);border:5px solid #1c1b22;border-radius:16px;box-shadow:inset 0 6px 0 rgba(255,255,255,.3),inset 0 -7px 0 #b8222a;transition:transform .8s cubic-bezier(.3,1.6,.5,1),opacity .8s}
.lid::before,.lid::after{content:'✦ ✧';position:absolute;top:22%;color:#fff6e6;font-size:clamp(14px,3.4vw,20px);letter-spacing:6px}.lid::before{left:6%}.lid::after{right:6%;content:'✧ ✦'}
.fbody{margin-top:-5px;background:#fff3df;border:5px solid #1c1b22;border-radius:4px 4px 22px 22px;padding:clamp(6px,1.8vw,12px) clamp(6px,1.8vw,12px) clamp(12px,3vw,18px);box-shadow:inset 0 -8px 0 #f0d8b6,0 14px 24px rgba(0,0,0,.4)}
.mini{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(3px,.9vw,6px)}
.mini span{display:grid;place-items:center;aspect-ratio:1;border-radius:10px}
.bow{position:absolute;left:50%;bottom:calc(100% - 4px);width:44%;transform:translate(-50%,0);z-index:4;transition:transform .9s ease-in,opacity .9s;pointer-events:none}
.box>.bow{bottom:auto;top:0;transform:translate(-50%,-62%)}
.untie .box>.bow{transform:translate(-50%,-260px) rotate(200deg) scale(.6);opacity:0}
.open .lid{transform:translate(-30%,-260%) rotate(-25deg);opacity:0}
.gift{position:absolute;left:50%;bottom:30%;width:min(150px,36vw);transform:translate(-50%,40%) scale(.3);z-index:1;transition:transform .7s cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.gift{width:min(270px,72vw)!important}
.wcard{background:#fff8e7;color:#2a2340;border:5px solid #f4b942;border-radius:22px;padding:14px 16px 18px;text-align:center;box-shadow:0 8px 0 #d99a22}
.wcard img{width:54px;height:54px;margin:-44px auto 2px;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.wcard small{display:block;font-size:15px;color:#e04b4b}
.wcard p{margin:4px 0 0;font-size:clamp(22px,5.6vw,28px);line-height:1.3;text-wrap:balance;word-break:keep-all}
.open .gift{z-index:6}
.tabs button.wrong{animation:shake .45s 2}
.sv{position:fixed;inset:0;z-index:20;background:rgba(10,15,35,.95);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.sv.show{display:flex}
.sv img{max-width:min(520px,92vw);max-height:68vh;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto}
.nm{display:flex;align-items:center;gap:10px;font-size:22px;margin-bottom:12px}
.nm input{font:inherit;font-size:22px;width:min(220px,50vw);padding:8px 14px;border-radius:14px;border:3px solid var(--gold);background:#fff8e7;color:#2a2340;user-select:text}
.sv p{text-align:center;font-size:19px;margin:14px 0 0;color:#dfe6ff}
.open .gift{transform:translate(-50%,-55%) scale(1)}
.cell img,.stk img,.mini img,.rbox img{width:82%;height:82%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain}
.snd img{width:30px;height:30px}
.conf img{width:100%}
.rtxt img{width:1.5em;height:1.5em;vertical-align:-.4em}
.glow{position:absolute;left:50%;top:35%;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 0 rgba(244,185,66,.0);transition:box-shadow 1s}
.open .glow{box-shadow:0 0 120px 90px rgba(244,185,66,.45)}
.merry{font-size:clamp(38px,9vw,72px);line-height:1.1;margin:18px 0 4px;text-align:center;min-height:1.2em}
.merry span{display:inline-block;opacity:0;transform:translateY(30px) scale(.4)}
.merry.go span{animation:jump .5s forwards}
@keyframes jump{60%{opacity:1;transform:translateY(-14px) scale(1.2)}to{opacity:1;transform:none}}
.eng{color:var(--gold);font-size:22px;opacity:0;transition:opacity .6s .9s}
.merry.go+.eng{opacity:1}
.rule{margin:12px 0 0;font-size:19px;text-align:center;color:#dfe6ff;opacity:0;transition:opacity .5s 1.3s}
.rule.go{opacity:1}
.ov .acts{opacity:0;transition:opacity .5s 1.6s}.ov .acts.go{opacity:1}
.rrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.rrow.col{flex-direction:column;gap:6px}
.rbox{display:inline-flex;gap:5px;padding:7px;border:3px dashed var(--gold);border-radius:16px;background:rgba(255,255,255,.08)}
.rbox span{width:clamp(38px,8vw,58px);aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:clamp(24px,5.4vw,38px);line-height:1}
.rarr{font-size:26px;color:var(--gold)}
.rtxt{font-size:clamp(19px,3.4vw,24px);margin-top:6px}
.conf{position:absolute;top:-30px;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(115vh) rotate(720deg)}}
/* 태블릿 가로 화면: 한 화면에 쏙 들어오게 */
@media (orientation:landscape) and (min-width:900px){
 .wrap{max-width:1180px;padding-top:10px;padding-bottom:16px}
 .bar{margin:8px 0 6px}
 .grid{max-width:none!important;width:min(100%,calc(var(--cols)*min(92px,(100vh - 450px)/var(--rows,2))))}
 .pal-t{margin:12px 0 6px}
 .stk{width:clamp(48px,calc((100vw - 240px)/13),74px)}
 .acts{margin-top:14px}
 .ov.show{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:40px;align-content:center;align-items:center;padding:20px 40px}
 .ov>.scene{grid-column:1;grid-row:1/span 6;margin:0!important;justify-self:end;align-self:center;width:min(420px,42vw);height:min(480px,82vh)}
 .ov>.merry,.ov>.eng,.ov>.rule,.ov>#song,.ov>#ovActs{grid-column:2;justify-self:center}
 .ov>.merry{margin-top:0;font-size:clamp(36px,5vw,64px)}
 .ov>#ovActs{margin-bottom:0!important}
 .sv img{max-height:70vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}.snowfx{display:none}}
@media (max-width:600px){header{justify-content:center;text-align:center}.cell{border-radius:10px;border-width:2px}}
</style>
</head>
<body>
<div class="snowfx" id="snowfx"></div>
<div class="wrap">
  <header>
    <h1><img class="ic" data-k="gift" alt=""> 규칙대로 <b>선물 포장</b>하기</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="tabs" role="tablist">
        <button id="tFind" class="on">규칙 찾기</button>
        <button id="tFree">나만의 포장지</button>
      </div>
      <button class="snd" id="snd" aria-label="소리 켜기/끄기"><img data-k="soundon" alt=""></button>
    </div>
  </header>
  <div class="bar"><div class="lv" id="lv">1단계</div><div class="dots" id="dots"></div></div>
  <div class="msg" id="msg">규칙을 찾아 포장지를 꾸며요!</div>
  <div class="paper"><div class="grid" id="grid"></div></div>
  <div class="pal-t" id="palT">① 스티커를 고르고 ② 빈칸을 톡! 눌러요</div>
  <div class="pal" id="pal"></div>
  <div class="acts">
    <button id="clear"><img class="ic" data-k="broom" alt=""> 다시 하기</button>
    <button class="go" id="done"><img class="ic" data-k="bowsmall" alt=""> 포장 완료!</button>
  </div>
</div>

<div class="sv" id="tp">
  <div style="font-size:28px;margin-bottom:6px">👩‍🏫 선생님 메뉴</div>
  <p id="tpInfo" style="margin:0 0 14px"></p>
  <div class="acts" style="flex-direction:column;align-items:stretch">
    <button id="tpReset">🔄 진행 기록 지우기 (1단계부터, 다시 잠금)</button>
    <button id="tpOpen">🔓 이번만 잠금 풀기 (시범용)</button>
    <button class="go" id="tpClose">닫기</button>
  </div>
</div>
<div class="sv" id="sv">
  <label class="nm">✏️ 내 이름 <input id="nmIn" maxlength="10" placeholder="이름을 써요" autocomplete="off"></label>
  <img id="svImg" alt="내 선물 상자 그림">
  <p id="svTip"></p>
  <div class="acts"><button id="svClose">닫기</button><button class="go" id="svDown">💾 저장하기</button></div>
</div>
<div class="ov" id="ov">
  <div class="scene" id="scene">
    <div class="glow"></div>
    <div class="gift" id="gift"></div>
    <div class="box">
      <img class="bow" data-k="bow" alt="리본">
      <div class="lid"></div>
      <div class="fbody"><div class="mini" id="mini"></div></div>
    </div>
  </div>
  <div class="merry" id="merry"></div>
  <div class="eng">Merry Christmas!</div>
  <div class="rule" id="rule"></div>
  <div class="rule" id="song" style="font-size:16px;color:#9fb0e0;margin-top:6px"></div>
  <div class="acts" id="ovActs">
    <button id="again">🔁 다시 꾸미기</button>
    <button id="save" style="display:none">📷 그림으로 저장</button>
    <button class="go" id="next">다음 선물 ▶</button>
  </div>
</div>

/* 검사 */
function bestPeriod(seq,max=4){let best=null;for(let p=2;p<=max;p++){const bad=[];for(let i=p;i<seq.length;i++)if(seq[i]!==seq[i-p])bad.push(i);
  if(!best||bad.length<best.bad.length)best={p,bad};}return best;}
function mark(list,cls){const g=$('grid').children;list.forEach(i=>g[i].classList.add(cls));setTimeout(()=>list.forEach(i=>g[i]&&g[i].classList.remove(cls)),1900);}
$('done').onclick=()=>{if(mode==='find')return;
  const holes=cells.map((v,i)=>v==null?i:-1).filter(i=>i>=0);
  if(holes.length){say(`아직 빈칸이 ${holes.length}개 있어요. 반짝이는 칸을 채워요!`,1);mark(holes,'hole');sBad();return;}
  if(mode==='find'){const wrong=cells.map((v,i)=>v!==answer[i]?i:-1).filter(i=>i>=0);
    if(wrong.length){say('앗! 규칙과 다른 곳이 있어요. 흔들리는 칸을 다시 살펴봐요.',1);mark(wrong,'wrong');sBad();return;}
    const per=STAGES[stage].p.startsWith('rand')?bestPeriod(answer).p:STAGES[stage].p.length;
    win(RULE1(answer.slice(0,per)),i=>answer[i%per],per);}
  else{const kinds=new Set(cells).size;
    if(kinds<2){say('스티커를 두 가지 이상 써서 규칙을 만들어 봐요!',1);sBad();return;}
    // ① 한 줄로 이어지는 묶음 규칙(2~9개 묶음, 2번 이상 되풀이)
    const b=bestPeriod(cells,Math.floor(cells.length/2));
    // ② 줄 규칙: 모든 줄이 같거나(1), 두 줄이 번갈아 되풀이(2)
    const row=r=>cells.slice(r*cols,r*cols+cols),em=a=>a.map(v=>STK[v][0]).join('');
    let rb=null;for(let r=1;r<=2;r++){const bad=[];for(let i=r*cols;i<cells.length;i++)if(cells[i]!==cells[i-r*cols])bad.push(i);
      if(!rb||bad.length<rb.bad.length)rb={r,bad};}
    if(!b.bad.length){win(RULE1(cells.slice(0,b.p)),i=>cells[i%b.p],b.p);return;}
    if(!rb.bad.length){win(rb.r===1?`<div class="rrow col">${RB(row(0))}${RB(row(0))}</div><div class="rtxt">줄마다 똑같이 되풀이되는 규칙이었어요!</div>`
      :`<div class="rrow col">${RB(row(0))}${RB(row(1))}${RB(row(0))}</div><div class="rtxt">두 가지 줄이 번갈아 나오는 규칙이었어요!</div>`,i=>cells[(Math.floor(i/cols)%rb.r)*cols+i%cols]);return;}
    const w=rb.bad.length<b.bad.length?rb.bad:b.bad;
    say('규칙이 끊긴 곳이 있어요! 흔들리는 칸을 고쳐 봐요.',1);mark(w,'wrong');sBad();}
};

function wrapText(c,t,x,y,maxW,lh){const words=t.split(' ');let line='',ys=[];const lines=[];
  for(const w of words){const tt=line?line+' '+w:w;if(c.measureText(tt).width>maxW&&line){lines.push(line);line=w}else line=tt}lines.push(line);
  lines.forEach((l,i)=>c.fillText(l,x,y+i*lh));}

$('nmIn').addEventListener('input',()=>{try{localStorage.setItem(NKEY,$('nmIn').value)}catch(e){}clearTimeout(rt);rt=setTimeout(redraw,250);});
$('save').onclick=async()=>{if(!lastWin)return;try{$('nmIn').value=localStorage.getItem(NKEY)||''}catch(e){}
  $('svTip').innerHTML=isIOS?'이름을 쓰고, 그림을 <b>길게 눌러</b> "사진에 저장"을 눌러요.':'이름을 쓰고 <b>💾 저장하기</b>를 눌러요. (그림을 길게 누르거나 오른쪽 클릭해도 저장돼요)';
  $('svDown').style.display=isIOS?'none':'';
  $('sv').classList.add('show');await redraw();};
$('svDown').onclick=()=>{if(!picURL)return;const n=($('nmIn').value||'나').trim();
  try{const a=document.createElement('a');a.href=picURL;a.download=n+'의-크리스마스-선물상자.png';document.body.appendChild(a);a.click();a.remove();}catch(e){}};
$('svClose').onclick=()=>$('sv').classList.remove('show');
function confetti(){const ov=$('ov'),it=['snowflake','star','candy','bell','gift','star'].map(k=>`<img src="${IMG[k]}" alt="">`);
  for(let i=0;i<50;i++){const c=document.createElement('div');c.className='conf';c.innerHTML=it[i%it.length];
    c.style.left=Math.random()*100+'%';c.style.width=(18+Math.random()*24)+'px';
    c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*.8)+'s';ov.appendChild(c);setTimeout(()=>c.remove(),6000);}}
$('again').onclick=()=>{$('ov').classList.remove('show');bgm.duck=false;bgmApply();if(mode==='find'){load();return;}cells=cells.map((v,i)=>locked[i]?v:null);drawGrid();say('다시 한번 꾸며 봐요!');};
$('next').onclick=()=>{$('ov').classList.remove('show');bgm.duck=false;bgmApply();if(justUnlocked){justUnlocked=false;$('tFree').onclick();return;}if(mode==='find')stage=nextStage();load();};

/* 모드·소리 */
$('tFind').onclick=()=>{mode='find';$('tFind').classList.add('on');$('tFree').classList.remove('on');load();};
$('tFree').onclick=()=>{if(!isOpen()){say(`🔒 1~8단계를 모두 통과하면 <b>나만의 포장지</b>가 열려요! (지금 ${cleared.size}/8 통과)`,1);sBad();$('tFree').classList.add('wrong');setTimeout(()=>$('tFree').classList.remove('wrong'),900);return;}
  mode='free';$('tFree').classList.add('on');$('tFind').classList.remove('on');load();};
// 선생님용: 제목을 5번 빠르게 누르면 잠금 풀기/다시 잠그기
let tt=0,tc=0;document.querySelector('h1').addEventListener('click',()=>{const n=Date.now();tc=n-tt<600?tc+1:1;tt=n;
  if(tc>=5){tc=0;$('tp').classList.add('show');}});
$('snd').onclick=()=>{sound=!sound;bgmApply();$('snd').innerHTML=`<img src="${sound?IMG.soundon:IMG.soundoff}" alt="">`;};

/* 눈 */
const sf=$('snowfx');sf.innerHTML=Array.from({length:26},()=>`<i style="left:${Math.random()*100}%;font-size:${8+Math.random()*14}px;animation-duration:${8+Math.random()*10}s;animation-delay:-${Math.random()*15}s">❄</i>`).join('');
try{const d=JSON.parse(localStorage.getItem(PKEY)||'{}');(d.c||[]).forEach(i=>cleared.add(i));}catch(e){}
if(!isOpen()){const f=STAGES.findIndex((_,i)=>!cleared.has(i));stage=f<0?0:f;}
lockUI();
const tpInfo=()=>{$('tpInfo').textContent=`이 기기 기록: ${cleared.size}/8단계 통과 · 나만의 포장지 ${isOpen()?'열림':'잠김'}`;};
document.querySelector('h1').addEventListener('click',tpInfo);
$('tpReset').onclick=()=>{cleared.clear();teacher=false;saveProg();stage=0;$('tp').classList.remove('show');$('tFind').onclick();say('🔄 기록을 지웠어요. 1단계부터 다시 시작해요!');};
$('tpOpen').onclick=()=>{teacher=true;lockUI();tpInfo();$('tp').classList.remove('show');say('🔓 이번만 잠금을 풀었어요. 새로 고침하면 다시 잠겨요.');};
$('tpClose').onclick=()=>$('tp').classList.remove('show');
// 두 번 톡·두 손가락으로 화면이 커지지 않게(아이패드)
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
load();
}
</script>
</body>
</html>
